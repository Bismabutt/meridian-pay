apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: meridian-edge
  labels:
    app: api-gateway
    tier: "1"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        tier: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 45
      containers:
        - name: api-gateway
          image: meridian-pay/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis.meridian-app.svc.cluster.local
            - name: AUTH_SERVICE_URL
              value: http://auth-service.meridian-app.svc.cluster.local:8001
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.meridian-app.svc.cluster.local:8002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.meridian-money.svc.cluster.local:8004
            - name: FX_SERVICE_URL
              value: http://fx-service.meridian-app.svc.cluster.local:8007
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}