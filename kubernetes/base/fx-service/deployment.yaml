apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-service
  namespace: meridian-app
  labels:
    app: fx-service
    tier: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fx-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fx-service
        tier: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: fx-service
          image: meridian-pay/fx-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8007
          env:
            - name: DB_PORT
              value: "5432"
            - name: DB_HOST
              value: postgres.meridian-app.svc.cluster.local
            - name: DB_NAME
              value: fx_db
            - name: FX_PROVIDER_URL
              value: http://fx-provider-sandbox.meridian-app.svc.cluster.local:9102
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fx-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}