apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: meridian-app
  labels:
    app: account-service
    tier: "2"
spec:
  replicas: 6
  selector:
    matchLabels:
      app: account-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: account-service
        tier: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: account-service
          image: meridian-pay/account-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: DB_HOST
              value: postgres.meridian-app.svc.cluster.local
            - name: DB_NAME
              value: account_db
            - name: REDIS_HOST
              value: redis.meridian-app.svc.cluster.local
            - name: KAFKA_BOOTSTRAP
              value: kafka.meridian-app.svc.cluster.local:9092
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.meridian-money.svc.cluster.local:8005
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-db-credentials
                  key: password
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}