apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: meridian-app
  labels:
    app: auth-service
    tier: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        tier: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: meridian-pay/auth-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: DB_PORT
              value: "5432"
            - name: DB_HOST
              value: postgres.meridian-app.svc.cluster.local
            - name: DB_NAME
              value: auth_db
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: redis.meridian-app.svc.cluster.local
            - name: KAFKA_BOOTSTRAP
              value: kafka.meridian-app.svc.cluster.local:9092
            - name: IDENTITY_PROVIDER_URL
              value: http://identity-provider-sandbox.meridian-app.svc.cluster.local:9101
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: secret
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}