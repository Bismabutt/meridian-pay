apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: meridian-app
  labels:
    app: notification-service
    tier: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: notification-service
        tier: "3"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: meridian-pay/notification-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
          env:
            - name: DB_HOST
              value: postgres.meridian-app.svc.cluster.local
            - name: DB_NAME
              value: notif_db
            - name: KAFKA_BOOTSTRAP
              value: kafka.meridian-app.svc.cluster.local:9092
            - name: EMAIL_PROVIDER_URL
              value: http://email-provider-sandbox.meridian-app.svc.cluster.local:9103
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m           # Tier 3 is capped, so it cannot starve the money path
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}