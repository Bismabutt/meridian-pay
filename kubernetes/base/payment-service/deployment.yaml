apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: meridian-money
  labels:
    app: payment-service
    tier: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # Tier 1: never reduce capacity during a rollout
  template:
    metadata:
      labels:
        app: payment-service
        tier: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # Tier 1 services must finish in-flight payments before exiting.
      terminationGracePeriodSeconds: 60

      containers:
        - name: payment-service
          image: meridian-pay/payment-service:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8004

          env:
            - name: DB_PORT
              value: "5432"
            - name: DB_HOST
              value: postgres.meridian-app.svc.cluster.local
            - name: DB_NAME
              value: payment_db
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: redis.meridian-app.svc.cluster.local
            - name: KAFKA_BOOTSTRAP
              value: kafka.meridian-app.svc.cluster.local:9092
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.meridian-money.svc.cluster.local:8005
            - name: PARTNER_BANK_URL
              value: http://partner-bank-sandbox.meridian-app.svc.cluster.local:9100
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-credentials
                  key: password

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi     # equal to request → Guaranteed QoS

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}