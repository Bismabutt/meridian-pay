# Sandbox for the identity-provider dependency. Stands in for a third party so
# failure modes can be exercised deliberately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-provider-sandbox
  namespace: meridian-app
  labels:
    app: identity-provider-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-provider-sandbox
  template:
    metadata:
      labels:
        app: identity-provider-sandbox
    spec:
      containers:
        - name: identity-provider
          image: 177034711013.dkr.ecr.eu-west-2.amazonaws.com/meridian-pay/identity-provider:3.0.0
          ports:
            - name: http
              containerPort: 9101
          env:
            - name: PORT
              value: "9101"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-provider-sandbox
  namespace: meridian-app
  labels:
    app: identity-provider-sandbox
spec:
  selector:
    app: identity-provider-sandbox
  ports:
    - name: http
      port: 9101
      targetPort: http
