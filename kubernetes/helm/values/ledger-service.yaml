nameOverride: ledger-service
namespace: meridian-money
tier: "1"
port: 8005
replicas: 3

image:
  repository: meridian-pay/ledger-service

strategy:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    memory: 2Gi

# Scales vertically before horizontally: write correctness outranks throughput.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  scaleUpPercent: 50
  scaleUpPeriodSeconds: 60
  scaleDownStabilizationSeconds: 600

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  DB_HOST: postgres.meridian-app.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: ledger_db
  PORT: "8005"

envFromSecret:
  DB_PASSWORD:
    name: ledger-db-credentials
    key: password
