nameOverride: auth-service
namespace: meridian-app
tier: "1"
port: 8001
replicas: 3

image:
  repository: meridian-pay/auth-service

strategy:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 30

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  scaleUpPercent: 100
  scaleUpPeriodSeconds: 30
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  DB_HOST: postgres.meridian-app.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: auth_db
  REDIS_HOST: redis.meridian-app.svc.cluster.local
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: kafka.meridian-app.svc.cluster.local:9092
  IDENTITY_PROVIDER_URL: http://identity-provider-sandbox.meridian-app.svc.cluster.local:9101

envFromSecret:
  DB_PASSWORD:
    name: auth-db-credentials
    key: password
  JWT_SECRET:
    name: auth-jwt-secret
    key: secret
