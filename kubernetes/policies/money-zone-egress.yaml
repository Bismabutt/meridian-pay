# ============================================================
# Outbound traffic permitted from the money zone.
# Default deny blocks egress too, so these are required.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-money-zone-egress
  namespace: meridian-money
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS, or nothing can resolve anything
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Databases, Redis, and the partner bank sandbox
    - to:
        - namespaceSelector:
            matchLabels:
              zone: application
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9100

    # Kafka, which runs in its own namespace under the Strimzi operator
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092

    # payment-service to ledger-service, within the zone
    - to:
        - podSelector:
            matchLabels:
              app: ledger-service
      ports:
        - protocol: TCP
          port: 8005

    # RDS and ElastiCache sit outside the cluster, in the VPC. They are
    # reached by IP rather than by namespace, so the rule is CIDR based.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379