# ============================================================
# Local cluster for validating manifests and the money zone
# isolation before deploying to EKS.
#
# disableDefaultCNI is required: kind's default networking does
# not enforce NetworkPolicies, so policies would be accepted and
# silently ignored. Calico is installed after cluster creation.
# ============================================================

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian-local

networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 8000
        protocol: TCP
  - role: worker
  - role: worker