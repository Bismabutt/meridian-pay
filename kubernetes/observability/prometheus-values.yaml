# Sized for a local cluster. EKS values increase retention and storage.

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Scrape any ServiceMonitor in the cluster, not only those with the
    # release label. Simpler for a single-tenant platform.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  adminPassword: meridian-local
  persistence:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  defaultDashboardsEnabled: true

alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi

  config:
    global:
      resolve_timeout: 5m

    # Route by severity. Critical alerts are customer impacting and go
    # straight through; warnings are grouped and sent less often.
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-warnings'
      routes:
        - matchers:
            - severity = "critical"
          receiver: 'slack-critical'
          group_wait: 0s
          repeat_interval: 30m

    receivers:
      - name: 'slack-critical'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: '#alerts-production'
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

      - name: 'slack-warnings'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: '#alerts-production'
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

# Node and kubelet metrics, for the capacity panels
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# Not needed on kind — these components are not exposed
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
