name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  # ============================================================
  # GATE 1 — Secret scanning
  # Discovery finding: .env with AWS credentials was committed and
  # remained accessible to former employees.
  # ============================================================
  secret-scan:
    name: Secret scan (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks over full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact -v --exit-code 1
            
  # ============================================================
  # GATE 2 — Static analysis
  # Detects the SQL injection in auth-service and the weak
  # password hashing.
  # ============================================================
  static-analysis:
    name: Static analysis (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar needs history for accurate blame

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # GATE 3 — Infrastructure as code scanning
  # ============================================================
  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          output_format: cli

  # ============================================================
  # Terraform validation
  # ============================================================
  terraform-validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate modules
        run: |
          for dir in infrastructure/terraform/modules/*/; do
            echo "--- validating $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  # ============================================================
  # GATE 4 — Dependency and image scanning, per service
  # Detects PyJWT 2.4.0 with its published CVE.
  # ============================================================
  build-and-scan:
    name: Build and scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # report every service, not just the first failure
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - payment-service
          - ledger-service
          - fraud-service
          - fx-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true
          tags: meridian-pay/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: meridian-pay/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'                    # fail the build on findings
          ignore-unfixed: true              # only findings with an available fix
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'